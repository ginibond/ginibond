mixed-port: 7890
geox-url:
  geoip: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://download-1302801676.cos.ap-shanghai.myqcloud.com/Country/Country_All.mmdb"
geo-auto-update: true
geo-update-interval: 24
find-process-mode: strict
profile:
  store-selected: true
  store-fake-ip: true
tcp-concurrent: true
allow-lan: true
mode: rule
log-level: info
ipv6: true
#interface-name: en0

dns:
  enable: true
  listen: 0.0.0.0:53
  prefer-h3: true
  ipv6: true
  default-nameserver:
#    - 114.114.114.114
    - tls://223.5.5.5:853
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.linksys.com'
    - '+.pool.ntp.org'
    - localhost.ptlogin2.qq.com
    - +.stun.*.*
    - +.stun.*.*.*
    - +.stun.*.*.*.*
    - +.stun.*.*.*.*.*
    - "*.n.n.srv.nintendo.net"
    - +.stun.playstation.net
    - xbox.*.*.microsoft.com
    - "*.*.xboxlive.com"
    - "*.msftncsi.com"
    - "*.msftconnecttest.com"
    - WORKGROUP
  nameserver-policy:
    "geosite:cn": 
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - 8.8.8.8
    - tcp://1.1.1.1
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
      - gfw
    ipcidr:
      - 240.0.0.0/4
    domain:
      - '+.google.com'
      - '+.facebook.com'
      - '+.youtube.com'

tun:
  enable: true
  stack: gvisor
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53

proxy-providers:
  ALL: &ALL
    type: http
    path: ./Proxies/ALL.yaml
    url: 写订阅
    interval: 86400
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 86400
  HK:
   <<: *ALL
   filter: "(?i)(香港|HK|Hong|🇭🇰|深港|沪港|HKG|𝘏𝘰𝘯𝘨 𝘒𝘰𝘯𝘨)"
  TW:
   <<: *ALL
   filter: "(?i)(台湾|台灣|TW|Taiwan|🇹🇼|台北|新北|彰化|深台|沪台|广台|京台)"
  SG:
   <<: *ALL
   filter: "(?i)(新加坡|SG|Singapore|🇸🇬|狮城|SGP|深新|沪新|广新|京新)"
  JP:
   <<: *ALL
   filter: "(?i)(日本|JP|Japan|🇯🇵|东京|大阪|埼玉|川崎|深日|沪日|广日|京日)"
  US:
   <<: *ALL
   filter: "(?i)(美国|US|America|United States|🇺🇸|洛杉矶|圣何塞|西雅图|波特兰|纽约|中美|深美|沪美|广美|京美)"
  KR:
   <<: *ALL
   filter: "(?i)(韩国|韓國|KR|Korea|🇰🇷|首尔|春川|深韩|沪韩|广韩|京韩)"
  DE:
   <<: *ALL
   filter: "(?i)(德国|德國|DE|Germany|🇩🇪|法兰克福|慕尼黑)"
  UK:
   <<: *ALL
   filter: "(?i)(英国|英國|UK|Britain|United Kingdom|🇬🇧|伦敦)"
  FR:
   <<: *ALL
   filter: "(?i)(法国|法國|FR|France|🇫🇷|巴黎)"

